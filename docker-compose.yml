services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simple-backend
    restart: unless-stopped
    ports:
      - "8051:8000"
    environment:
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8051}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8050:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8051}
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: simple_fullstack_network